<svg xmlns="http://www.w3.org/2000/svg" width="820" height="528" viewBox="0 0 820 528" role="img" aria-label="The four configuration layers stacked above the machine, all rendered from one plan.json">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#65717F"/>
    </marker>
    <marker id="arwa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#17618F"/>
    </marker>
    <marker id="arwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#17618F" opacity="0.6"/>
    </marker>
  </defs>

  <rect width="820" height="528" fill="#FFFFFF"/>

  <!-- ── plan.json rail ─────────────────────────────────────────── -->
  <rect x="24" y="24" width="112" height="32" rx="5" fill="#FFFFFF" stroke="#17618F" stroke-width="1.4"/>
  <text x="80" y="45" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#17618F">plan.json</text>
  <line x1="80" y1="56" x2="80" y2="360" stroke="#17618F" stroke-width="1" opacity="0.5"/>
  <line x1="80" y1="60"  x2="164" y2="60"  stroke="#17618F" stroke-width="1" opacity="0.5" marker-end="url(#arwd)"/>
  <line x1="80" y1="160" x2="164" y2="160" stroke="#17618F" stroke-width="1" opacity="0.5" marker-end="url(#arwd)"/>
  <line x1="80" y1="260" x2="164" y2="260" stroke="#17618F" stroke-width="1" opacity="0.5" marker-end="url(#arwd)"/>
  <line x1="80" y1="360" x2="164" y2="360" stroke="#17618F" stroke-width="1" opacity="0.5" marker-end="url(#arwd)"/>
  <text x="80" y="382" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#65717F">rendered into</text>
  <text x="80" y="395" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#65717F">all four</text>

  <!-- ── LAYER 4 ────────────────────────────────────────────────── -->
  <rect x="170" y="24" width="626" height="72" rx="6" fill="#F5F8FA" stroke="#CBD5DF"/>
  <rect x="170" y="24" width="4" height="72" rx="2" fill="#6A3FA0"/>
  <text x="190" y="45" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#17618F" letter-spacing="0.9">LAYER 4</text>
  <text x="256" y="45" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121821">Application contract</text>
  <text x="190" y="65" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#39444F">SHARED_CORES · EXCLUSIVE_CORES</text>
  <text x="190" y="83" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#65717F">/etc/lowlatency/cores.env · read at start</text>

  <line x1="220" y1="124" x2="220" y2="98" stroke="#65717F" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="236" y="115" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#65717F">the app is handed the same list, as a string</text>

  <!-- ── LAYER 3 ────────────────────────────────────────────────── -->
  <rect x="170" y="124" width="626" height="72" rx="6" fill="#F5F8FA" stroke="#CBD5DF"/>
  <rect x="170" y="124" width="4" height="72" rx="2" fill="#0F6E66"/>
  <text x="190" y="145" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#17618F" letter-spacing="0.9">LAYER 3</text>
  <text x="256" y="145" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121821">Runtime pinning</text>
  <text x="190" y="165" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#39444F">IRQ affinity · NIC queues · workqueues · XPS</text>
  <text x="190" y="183" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#65717F">scripts/apply-runtime.sh · every boot</text>

  <line x1="220" y1="224" x2="220" y2="198" stroke="#65717F" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="236" y="215" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#65717F">cgroups fence tasks; they cannot move an interrupt</text>

  <!-- ── LAYER 2 ────────────────────────────────────────────────── -->
  <rect x="170" y="224" width="626" height="72" rx="6" fill="#F5F8FA" stroke="#CBD5DF"/>
  <rect x="170" y="224" width="4" height="72" rx="2" fill="#1F5F92"/>
  <text x="190" y="245" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#17618F" letter-spacing="0.9">LAYER 2</text>
  <text x="256" y="245" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121821">cgroup v2 cpusets</text>
  <text x="190" y="265" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#39444F">system.slice · irqnet.slice · pulsar.slice</text>
  <text x="190" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#65717F">/etc/systemd/system/ · daemon-reload, immediate</text>

  <line x1="220" y1="324" x2="220" y2="298" stroke="#17618F" stroke-width="2.2" marker-end="url(#arwa)"/>
  <text x="236" y="315" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#17618F">AllowedCPUs must equal isolcpus — the one hard constraint</text>

  <!-- ── LAYER 1 ────────────────────────────────────────────────── -->
  <rect x="170" y="324" width="626" height="72" rx="6" fill="#F5F8FA" stroke="#CBD5DF"/>
  <rect x="170" y="324" width="4" height="72" rx="2" fill="#1F5F92"/>
  <text x="190" y="345" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" font-weight="600" fill="#17618F" letter-spacing="0.9">LAYER 1</text>
  <text x="256" y="345" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121821">Kernel boot</text>
  <text x="190" y="365" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11.5" fill="#39444F">isolcpus · nohz_full · rcu_nocbs · irqaffinity · nosmt</text>
  <text x="190" y="383" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#65717F">/etc/default/grub.d/99-lowlatency.cfg · needs a reboot</text>

  <line x1="220" y1="436" x2="220" y2="398" stroke="#65717F" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="236" y="421" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#65717F">the hardware: cores, dies, NUMA distance</text>

  <!-- ── the machine ────────────────────────────────────────────── -->
  <rect x="170" y="436" width="626" height="68" rx="6" fill="#E9EEF3" stroke="#CBD5DF"/>
  <text x="190" y="457" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#121821">The machine</text>
  <text x="298" y="457" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#65717F">c7i / c8i / c7a / c8a metal</text>

  <rect x="190" y="468" width="76"  height="14" rx="2" fill="#9C5B18"/>
  <rect x="266" y="468" width="76"  height="14" rx="2" fill="#0F6E66"/>
  <rect x="342" y="468" width="114" height="14" rx="2" fill="#6A3FA0"/>
  <rect x="456" y="468" width="320" height="14" rx="2" fill="#1F5F92"/>

  <text x="228" y="493" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#65717F">housekeeping</text>
  <text x="304" y="493" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#65717F">irq / net</text>
  <text x="399" y="493" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#65717F">shared_cores</text>
  <text x="616" y="493" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#65717F">exclusive_cores — isolated</text>
</svg>
