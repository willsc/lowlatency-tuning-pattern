# Optional: for fleets that already standardise on tuned (AL2023, RHEL).
# This is an ALTERNATIVE delivery mechanism for the runtime layer, not an addition -
# do not run tuned and lltune-runtime.service at the same time.
#
# Install: cp -r tuned/lowlatency-pulsar /etc/tuned/ && tuned-adm profile lowlatency-pulsar
# The ${isolated_cores} variable is filled from /etc/tuned/lowlatency-pulsar-variables.conf,
# which `lltune render` emits alongside cores.env.

[main]
summary=Pulsar low-latency profile for AWS metal (isolated + shared core split)
include=latency-performance

[variables]
include=/etc/tuned/lowlatency-pulsar-variables.conf

[cpu]
force_latency=cstate.id:1|1
governor=performance
energy_perf_bias=performance
min_perf_pct=100

[sysctl]
kernel.numa_balancing=0
kernel.timer_migration=0
kernel.sched_autogroup_enabled=0
vm.stat_interval=300
vm.compaction_proactiveness=0

[vm]
transparent_hugepages=never

[irqbalance]
banned_cpus=${isolated_cores}

[script]
script=${i:PROFILE_DIR}/script.sh

[bootloader]
cmdline_lowlatency=+skew_tick=1 isolcpus=managed_irq,domain,${isolated_cores} nohz=on nohz_full=${isolated_cores} rcu_nocbs=${isolated_cores} irqaffinity=${housekeeping_cores}
