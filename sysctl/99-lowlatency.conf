# Managed by lltune. Installed to /etc/sysctl.d/99-lowlatency.conf
# Boot-time equivalents live on the GRUB cmdline; these are the knobs that only
# exist at runtime, plus belt-and-braces repeats of the important ones.

# --- scheduler / NUMA ---
kernel.numa_balancing = 0
kernel.timer_migration = 0
kernel.sched_autogroup_enabled = 0

# --- watchdogs and periodic noise on isolated cores ---
kernel.watchdog = 0
kernel.nmi_watchdog = 0
kernel.soft_watchdog = 0
kernel.hung_task_timeout_secs = 0
vm.stat_interval = 300

# --- memory: never let the latency path touch reclaim ---
vm.swappiness = 0
vm.zone_reclaim_mode = 0
vm.dirty_ratio = 10
vm.dirty_background_ratio = 3
vm.max_map_count = 1966080
vm.min_free_kbytes = 4194304
# Compaction stalls are multi-millisecond. THP is off, so proactive compaction buys nothing.
vm.compaction_proactiveness = 0

# --- network: sized for high-fanout Pulsar brokers ---
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 250000
net.core.rmem_max = 268435456
net.core.wmem_max = 268435456
net.core.optmem_max = 16777216
net.ipv4.tcp_rmem = 4096 262144 268435456
net.ipv4.tcp_wmem = 4096 262144 268435456
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_low_latency = 1
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_max_syn_backlog = 65535
# Busy polling: burns a shared core to skip the softirq wakeup. Enable per-socket via
# SO_BUSY_POLL in the app rather than globally if you cannot afford the CPU.
net.core.busy_poll = 0
net.core.busy_read = 0

# --- file handles ---
fs.file-max = 4194304
fs.nr_open = 4194304
fs.aio-max-nr = 1048576
